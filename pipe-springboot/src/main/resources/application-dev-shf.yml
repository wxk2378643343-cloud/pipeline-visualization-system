spring:
  datasource:
    driver-class-name: "com.mysql.cj.jdbc.Driver"
    url: ${PIPE_DB_URL}
    username: ${PIPE_DB_USERNAME}
    password: ${PIPE_DB_PASSWORD}

  jackson:
    # json 序列化排除值为 null 的属性
    default-property-inclusion: non_null

logging:
  level:
    root: warn #基础日志级别
    tyut.selab.a2.pipes: debug
